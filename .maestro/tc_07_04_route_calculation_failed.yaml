appId: ch.jls.reactnative.mapboxnavigation.example
name: TC-7.4 Unroutable destination triggers ROUTE_CALCULATION_FAILED
tags:
  - error
---
- runFlow: subflows/launch_dev_client.yaml
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
# Preset index 6 is "Unroutable (ocean destination)" — see
# example/src/constants/routes.ts. Mapbox Directions returns no routes for
# this (valid) destination; both platforms classify it as
# ROUTE_CALCULATION_FAILED. Note the SDK's failure message on Android is
# "Could not find a matching segment for input coordinates" — it contains
# "input" but is a routing failure, so RouteErrorClassifier matches the
# no-route/no-segment family ahead of the generic input/invalid branch.
- tapOn:
    id: 'home.preset.6'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
# Route calculation is async — allow up to 30s for the request to
# resolve before the error alert appears. Maestro's text matcher is
# regex + anchored; use DOTALL (?s) and wildcards for the multiline body.
- extendedWaitUntil:
    visible: 'Navigation Error'
    timeout: 30000
- assertVisible: '(?s).*ROUTE_CALCULATION_FAILED.*'
- tapOn: 'OK'
