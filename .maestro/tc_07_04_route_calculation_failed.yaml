appId: jlsdigital.reactnativemapboxnavigation.example
name: TC-7.4 Unroutable destination triggers ROUTE_CALCULATION_FAILED
tags:
  - error
---
- launchApp:
    clearState: true
# Fresh install: the dev-client renders its server list a beat after launch.
# Wait for it (optional) so the conditional tap below isn't skipped by an
# instantaneous visibility check that runs before the UI has drawn.
- extendedWaitUntil:
    visible:
      text: 'http://(localhost|10\.0\.2\.2):8081'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        text: 'http://(localhost|10\.0\.2\.2):8081'
    commands:
      - tapOn:
          text: 'http://(localhost|10\.0\.2\.2):8081'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      platform: iOS
      visible: 'Fast refresh'
    commands:
      - tapOn:
          point: '50%, 8%'
- runFlow:
    when:
      platform: Android
      visible: 'Fast Refresh'
    commands:
      # This dev-client renders the Android dev menu as a swipe-dismissable
      # bottom sheet (Reload / Go home / Fast Refresh …), not a full-screen
      # menu with a top-right X. Swipe it down to dismiss.
      - swipe:
          direction: DOWN
          duration: 400
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
# Preset index 6 is "Unroutable (ocean destination)" — see
# example/src/constants/routes.ts. Mapbox Directions returns no routes for
# this (valid) destination; the intended classification is
# ROUTE_CALCULATION_FAILED, which iOS produces.
#
# FIXME(parity): on Android this currently FAILS — the SDK's failure message
# is "Could not find a matching segment for input coordinates", and
# RouteErrorClassifier.classifyRouterFailure matches the "input" substring
# before the generic branch, mislabelling it INVALID_COORDINATES. iOS gets a
# clean typed/message path and reports ROUTE_CALCULATION_FAILED, so the two
# platforms disagree on the same scenario. The assertion below keeps the
# correct expectation; fix Android's classifier (match no-route/no-segment
# ahead of "input", or key off Mapbox's structured error code) rather than
# weakening this test.
- tapOn:
    id: 'home.preset.6'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
# Route calculation is async — allow up to 30s for the request to
# resolve before the error alert appears. Maestro's text matcher is
# regex + anchored; use DOTALL (?s) and wildcards for the multiline body.
- extendedWaitUntil:
    visible: 'Navigation Error'
    timeout: 30000
- assertVisible: '(?s).*ROUTE_CALCULATION_FAILED.*'
- tapOn: 'OK'
