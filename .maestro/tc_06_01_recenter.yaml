appId: ch.jls.reactnative.mapboxnavigation.example
name: TC-6.1 Recenter camera command
---
- runFlow: subflows/launch_dev_client.yaml
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- tapOn:
    id: 'home.preset.0'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
# Open the collapsed dev menu, then tap the Recenter action.
- tapOn:
    id: 'navigation.button.menu'
- extendedWaitUntil:
    visible:
      id: 'navigation.button.recenter'
    timeout: 5000
- tapOn:
    id: 'navigation.button.recenter'
# Menu collapses after the action fires.
- assertNotVisible:
    id: 'navigation.button.recenter'
