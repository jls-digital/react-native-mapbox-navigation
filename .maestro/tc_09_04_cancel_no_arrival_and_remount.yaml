appId: ch.jls.reactnative.mapboxnavigation.example
name: TC-9.4 Cancel does not fire arrival; remount after cancel works
tags:
  - lifecycle
---
- runFlow: subflows/launch_dev_client.yaml
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
# ── First nav session ────────────────────────────────────
- tapOn:
    id: 'home.preset.0'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
# Cancel mid-route via the SDK's cancel button in the bottom banner. The
# button's accessibility label differs by platform: iOS exposes the SDK's
# built-in cancel button as "close"; on Android the bottom trip-progress
# panel's stop button is labelled "End Navigation" and fires
# onCancelNavigation when tapped before arrival (onNavigationEnd only after
# arrival — see TripPanel in ReactNativeMapboxNavigation.kt). Tap promptly
# after mount so we exercise teardown mid-route, before the short (~150m)
# simulated preset reaches its destination.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'close'
          timeout: 15000
      - tapOn: 'close'
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: 'End Navigation'
          timeout: 15000
      - tapOn: 'End Navigation'
# onCancelNavigation goes back to Home.
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 10000
# No arrival event should have leaked through after cancel. Under the
# new arrival contract, onArrive no longer pops an Alert — so instead
# of asserting an alert's absence we rely on the companion TC-9.5 to
# prove the positive path and this assertion covers the negative: if
# the old bug recurs, the next mount below would crash on
# `checkInstanceIsUnique` and this flow would fail.
# ── Second nav session — proves teardown released the SDK session ─
# Pre-fix, mounting a second MapboxNavigation instance here tripped
# Mapbox's `checkInstanceIsUnique` assertion because the previous
# `MapboxNavigationProvider` was still alive.
- tapOn:
    id: 'home.preset.0'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
