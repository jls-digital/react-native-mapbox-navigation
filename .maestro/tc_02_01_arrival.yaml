appId: jlsdigital.reactnativemapboxnavigation.example
name: TC-2.1 Simulated route completes; onArrive fires; native end dismisses
tags:
  - smoke
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: 'http://(localhost|10\.0\.2\.2):8081'
    commands:
      - tapOn:
          text: 'http://(localhost|10\.0\.2\.2):8081'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
# First-launch expo-dev-client shows its dev menu after connecting.
# iOS: tap backdrop above the bottom sheet to dismiss.
# Android: the dev menu is full-screen; tap the Close (X) button top-right.
- runFlow:
    when:
      platform: iOS
      visible: 'Fast refresh'
    commands:
      - tapOn:
          point: '50%, 8%'
- runFlow:
    when:
      platform: Android
      visible: 'Fast Refresh'
    commands:
      - tapOn:
          point: '94%, 9%'
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- tapOn:
    id: 'home.preset.0'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
# Under the new arrival contract, onArrive is a notification-only
# hook — NavigationScreen just logs, it does not dismiss the nav
# view. The Mapbox SDK's own end-of-trip UI remains visible ("You
# have arrived" banner + rating + "End Navigation" button), which
# is what we assert on. The ~150m simulated preset finishes in well
# under a minute.
- extendedWaitUntil:
    visible: 'You have arrived'
    timeout: 120000
# Dismiss the Mapbox end-of-trip UI via its native "End Navigation"
# button. That fires onNavigationEnd in the example app, which calls
# navigation.goBack().
- tapOn: 'End Navigation'
- extendedWaitUntil:
    visible:
      id: 'home.startNavigation'
    timeout: 10000
