appId: jlsdigital.reactnativemapboxnavigation.example
name: TC-8.1 onRouteProgressChange events observed in debug console
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: 'http://localhost:8081'
    commands:
      - tapOn: 'http://localhost:8081'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
# First-launch expo-dev-client shows its dev menu as a bottom sheet.
# Tap the backdrop above the sheet to dismiss (iOS-style modal).
- runFlow:
    when:
      visible: 'Fast refresh'
    commands:
      - tapOn:
          point: '50%, 8%'
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- tapOn:
    id: 'home.preset.0'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
# Open the dev menu and toggle Debug to reveal the log console.
- tapOn:
    id: 'navigation.button.menu'
- extendedWaitUntil:
    visible:
      id: 'navigation.button.debug'
    timeout: 5000
- tapOn:
    id: 'navigation.button.debug'
# Debug log entries are prefixed with a timestamp (e.g. "12:05:53 PM
# Progress: 90.4% | 0.0km | 1min"); Maestro's text matcher is regex +
# anchored, so we need DOTALL/wildcards. Use a short timeout so we hit
# the assertion before the simulated short route reaches arrival.
- extendedWaitUntil:
    visible: '(?s).*Progress:.*'
    timeout: 15000
- extendedWaitUntil:
    visible: '(?s).*Location:.*'
    timeout: 15000
