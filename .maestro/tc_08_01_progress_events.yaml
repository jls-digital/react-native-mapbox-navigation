appId: jlsdigital.reactnativemapboxnavigation.example
name: TC-8.1 onRouteProgressChange events observed in debug console
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: 'http://(localhost|10\.0\.2\.2):8081'
    commands:
      - tapOn:
          text: 'http://(localhost|10\.0\.2\.2):8081'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
# First-launch expo-dev-client shows its dev menu after connecting.
# iOS: tap backdrop above the bottom sheet to dismiss.
# Android: the dev menu is full-screen; tap the Close (X) button top-right.
- runFlow:
    when:
      platform: iOS
      visible: 'Fast refresh'
    commands:
      - tapOn:
          point: '50%, 8%'
- runFlow:
    when:
      platform: Android
      visible: 'Fast Refresh'
    commands:
      - tapOn:
          point: '94%, 9%'
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- tapOn:
    id: 'home.preset.0'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
# Open the dev menu and toggle Debug to reveal the log console.
- tapOn:
    id: 'navigation.button.menu'
- extendedWaitUntil:
    visible:
      id: 'navigation.button.debug'
    timeout: 5000
- tapOn:
    id: 'navigation.button.debug'
# Debug log entries are prefixed with a timestamp (e.g. "12:05:53 PM
# Progress: 90.4% | 0.0km | 1min"); Maestro's text matcher is regex +
# anchored, so we need DOTALL/wildcards. Use a short timeout so we hit
# the assertion before the simulated short route reaches arrival.
- extendedWaitUntil:
    visible: '(?s).*Progress:.*'
    timeout: 15000
- extendedWaitUntil:
    visible: '(?s).*Location:.*'
    timeout: 15000
