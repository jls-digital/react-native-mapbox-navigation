appId: ch.jls.reactnative.mapboxnavigation.example
name: TC-5.2 Dark color scheme mounts nav view
---
- launchApp:
    clearState: true
# Fresh install: the dev-client renders its server list a beat after launch.
# Wait for it (optional) so the conditional tap below isn't skipped by an
# instantaneous visibility check that runs before the UI has drawn.
- extendedWaitUntil:
    visible:
      text: 'http://(localhost|10\.0\.2\.2):8081'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        text: 'http://(localhost|10\.0\.2\.2):8081'
    commands:
      - tapOn:
          text: 'http://(localhost|10\.0\.2\.2):8081'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
# First-launch expo-dev-client shows its dev menu after connecting.
# iOS: tap backdrop above the bottom sheet to dismiss.
# Android: the dev menu is full-screen; tap the Close (X) button top-right.
- runFlow:
    when:
      platform: iOS
      visible: 'Fast refresh'
    commands:
      - tapOn:
          point: '50%, 8%'
- runFlow:
    when:
      platform: Android
      visible: 'Fast Refresh'
    commands:
      # This dev-client renders the Android dev menu as a swipe-dismissable
      # bottom sheet (Reload / Go home / Fast Refresh …), not a full-screen
      # menu with a top-right X. Swipe it down to dismiss.
      - swipe:
          direction: DOWN
          duration: 400
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- tapOn:
    id: 'home.colorScheme.dark'
- tapOn:
    id: 'home.preset.0'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
