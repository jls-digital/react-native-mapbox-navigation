appId: ch.jls.reactnative.mapboxnavigation.example
name: TC-4.1 Start muted via JS prop, debug log shows mute state
tags:
  - voice
---
- launchApp:
    clearState: true
- runFlow:
    when:
      platform: Android
    commands:
      # Emulator dev-client can't auto-discover host Metro over the NAT (no LAN
      # broadcast like the iOS simulator), so connect explicitly to the host
      # loopback alias 10.0.2.2 via the manual URL field, then dismiss the
      # expo-dev-client menu (intro "Continue" -> full menu, closed with Back).
      - tapOn: 'exp://'
      - inputText: 'http://10.0.2.2:8081'
      - tapOn: 'Connect'
      - extendedWaitUntil:
          visible: 'Continue'
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: 'Continue'
          commands:
            - tapOn: 'Continue'
      - runFlow:
          when:
            visible: 'Go home'
          commands:
            - pressKey: Back
# Fresh install: the dev-client renders its server list a beat after launch.
# Wait for it (optional) so the conditional tap below isn't skipped by an
# instantaneous visibility check that runs before the UI has drawn.
- extendedWaitUntil:
    visible:
      text: 'http://(localhost|10\.0\.2\.2|[0-9.]+):8081'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        text: 'http://(localhost|10\.0\.2\.2|[0-9.]+):8081'
    commands:
      - tapOn:
          text: 'http://(localhost|10\.0\.2\.2|[0-9.]+):8081'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      platform: iOS
      visible: 'Fast refresh'
    commands:
      - tapOn:
          point: '50%, 8%'
- runFlow:
    when:
      platform: Android
      visible: 'Fast Refresh'
    commands:
      # This dev-client renders the Android dev menu as a swipe-dismissable
      # bottom sheet (Reload / Go home / Fast Refresh …), not a full-screen
      # menu with a top-right X. Swipe it down to dismiss.
      - swipe:
          direction: DOWN
          duration: 400
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- tapOn:
    id: 'home.preset.0'
# Mute now defaults to ON (HomeScreen `mute` useState = true), so
# navigation starts muted via the JS prop without toggling anything.
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
# Open the dev menu and reveal the debug console.
- tapOn:
    id: 'navigation.button.menu'
- extendedWaitUntil:
    visible:
      id: 'navigation.button.debug'
    timeout: 5000
- tapOn:
    id: 'navigation.button.debug'
# Starting muted does not itself emit onMuteChange (seed value only),
# so we verify the navigation UI mounted; the debug console stays
# open for any subsequent mute events from the native ornament.
- extendedWaitUntil:
    visible:
      id: 'navigation.debugConsole'
    timeout: 5000
