appId: ch.jls.reactnative.mapboxnavigation.example
name: TC-7.3 Invalid coordinates trigger INVALID_COORDINATES error
tags:
  - error
---
- launchApp:
    clearState: true
- runFlow:
    when:
      platform: Android
    commands:
      # Emulator dev-client can't auto-discover host Metro over the NAT (no LAN
      # broadcast like the iOS simulator), so connect explicitly to the host
      # loopback alias 10.0.2.2 via the manual URL field, then dismiss the
      # expo-dev-client menu (intro "Continue" -> full menu, closed with Back).
      - tapOn: 'exp://'
      - inputText: 'http://10.0.2.2:8081'
      - tapOn: 'Connect'
      - extendedWaitUntil:
          visible: 'Continue'
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: 'Continue'
          commands:
            - tapOn: 'Continue'
      - runFlow:
          when:
            visible: 'Go home'
          commands:
            - pressKey: Back
# Fresh install: the dev-client renders its server list a beat after launch.
# Wait for it (optional) so the conditional tap below isn't skipped by an
# instantaneous visibility check that runs before the UI has drawn.
- extendedWaitUntil:
    visible:
      text: 'http://(localhost|10\.0\.2\.2|[0-9.]+):8081'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        text: 'http://(localhost|10\.0\.2\.2|[0-9.]+):8081'
    commands:
      - tapOn:
          text: 'http://(localhost|10\.0\.2\.2|[0-9.]+):8081'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      platform: iOS
      visible: 'Fast refresh'
    commands:
      - tapOn:
          point: '50%, 8%'
- runFlow:
    when:
      platform: Android
      visible: 'Fast Refresh'
    commands:
      # This dev-client renders the Android dev menu as a swipe-dismissable
      # bottom sheet (Reload / Go home / Fast Refresh …), not a full-screen
      # menu with a top-right X. Swipe it down to dismiss.
      - swipe:
          direction: DOWN
          duration: 400
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
# Preset index 5 is "Invalid coordinates (out of range)" — see
# example/src/constants/routes.ts.
- tapOn:
    id: 'home.preset.5'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
# The native layer validates before requesting a route and fires
# onError synchronously, which the example app surfaces via an alert.
# Maestro's text matcher is regex + anchored, so use DOTALL (?s) and
# wildcards to match the multiline alert body.
- extendedWaitUntil:
    visible: 'Navigation Error'
    timeout: 15000
- assertVisible: '(?s).*INVALID_COORDINATES.*'
- tapOn: 'OK'
# INVALID_COORDINATES is a fatal error: NavigationScreen.onError shows the
# alert, then on OK calls navigation.goBack(), returning to Home. Verify we
# land back on the route list rather than stranding the user on an empty nav
# view.
- extendedWaitUntil:
    visible:
      id: 'home.startNavigation'
    timeout: 10000
