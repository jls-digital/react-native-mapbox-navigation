appId: jlsdigital.reactnativemapboxnavigation.example
name: TC-9.5 Arrival → remount works (teardown on RN unmount)
tags:
  - lifecycle
---
- launchApp:
    clearState: true
# Fresh install: the dev-client renders its server list a beat after launch.
# Wait for it (optional) so the conditional tap below isn't skipped by an
# instantaneous visibility check that runs before the UI has drawn.
- extendedWaitUntil:
    visible:
      text: 'http://(localhost|10\.0\.2\.2):8081'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        text: 'http://(localhost|10\.0\.2\.2):8081'
    commands:
      - tapOn:
          text: 'http://(localhost|10\.0\.2\.2):8081'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      platform: iOS
      visible: 'Fast refresh'
    commands:
      - tapOn:
          point: '50%, 8%'
- runFlow:
    when:
      platform: Android
      visible: 'Fast Refresh'
    commands:
      # This dev-client renders the Android dev menu as a swipe-dismissable
      # bottom sheet (Reload / Go home / Fast Refresh …), not a full-screen
      # menu with a top-right X. Swipe it down to dismiss.
      - swipe:
          direction: DOWN
          duration: 400
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
# ── First nav session — run to arrival ──────────────────
- tapOn:
    id: 'home.preset.0'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
# Short route finishes in well under a minute. The Mapbox native
# end-of-trip UI shows "You have arrived" — assert on that rather
# than our onArrive log (NavigationScreen no longer pops an Alert;
# the native banner is the stable signal).
- extendedWaitUntil:
    visible: 'You have arrived'
    timeout: 120000
# Tap the Mapbox native "End Navigation" button on the end-of-trip
# UI — that fires onNavigationEnd → navigation.goBack(). This path
# unmounts the MapboxNavigation component WITHOUT the SDK's cancel
# button firing. Pre-fix, teardown was hooked only into the SDK's
# dismiss delegate, so the MapboxNavigationProvider stayed alive
# and the next mount below tripped `checkInstanceIsUnique`.
- tapOn: 'End Navigation'
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 10000
# ── Second nav session — proves arrival-path teardown ran ────────
- tapOn:
    id: 'home.preset.0'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
