appId: jlsdigital.reactnativemapboxnavigation.example
name: Smoke — happy path (simulated short route)
tags:
  - smoke
---
# Launch → pick the short Zurich preset (simulated) → start navigation →
# dismiss the first-launch location permission dialog (if it appears) →
# wait for the native nav view to mount → wait for the arrival alert.
# Requires `MAPBOX_ACCESS_TOKEN` to be set in `example/.env` so the
# Expo config plugin injects it before the app is built. Runs against
# a fresh simctl privacy state; if permission is already granted the
# permission step is skipped automatically.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- tapOn:
    id: 'home.preset.0'
# Simulation is on by default; leaving the toggle alone.
- tapOn:
    id: 'home.startNavigation'
# First-launch permission dialog — tap through if present.
- runFlow:
    when:
      visible: 'Allow Once'
    commands:
      - tapOn: 'Allow Once'
# Native nav view should mount within ~20s of route fetch.
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
# Simulator drives the route at the SDK's default speed (no public
# speed multiplier on iOS v3, see SPEC §B7). Allow enough slack for
# the short Zurich preset to complete.
- extendedWaitUntil:
    visible: 'Arrived'
    timeout: 240000
