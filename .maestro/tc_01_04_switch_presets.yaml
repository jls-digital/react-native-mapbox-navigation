appId: ch.jls.reactnative.mapboxnavigation.example
name: TC-1.4 Switch between presets
---
- runFlow: subflows/launch_dev_client.yaml
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- tapOn:
    id: 'home.preset.2'
- tapOn:
    id: 'home.preset.3'
- tapOn:
    id: 'home.preset.0'
# Flow passes if every tap resolves (no element-not-found errors).
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: 'home.startNavigation'
