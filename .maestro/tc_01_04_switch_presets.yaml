appId: jlsdigital.reactnativemapboxnavigation.example
name: TC-1.4 Switch between presets
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: 'http://localhost:8081'
    commands:
      - tapOn: 'http://localhost:8081'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
# First-launch expo-dev-client shows its dev menu as a bottom sheet.
# Tap the backdrop above the sheet to dismiss (iOS-style modal).
- runFlow:
    when:
      visible: 'Fast refresh'
    commands:
      - tapOn:
          point: '50%, 8%'
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- tapOn:
    id: 'home.preset.2'
- tapOn:
    id: 'home.preset.3'
- tapOn:
    id: 'home.preset.0'
# Flow passes if every tap resolves (no element-not-found errors).
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: 'home.startNavigation'
