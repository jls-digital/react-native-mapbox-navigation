appId: ch.jls.reactnative.mapboxnavigation.example
name: TC-6.2 Show route overview command
---
- runFlow: subflows/launch_dev_client.yaml
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- tapOn:
    id: 'home.preset.0'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'home.startNavigation'
- extendedWaitUntil:
    visible:
      id: 'navigation.mapboxNavigation'
    timeout: 30000
- tapOn:
    id: 'navigation.button.menu'
- extendedWaitUntil:
    visible:
      id: 'navigation.button.overview'
    timeout: 5000
- tapOn:
    id: 'navigation.button.overview'
- assertNotVisible:
    id: 'navigation.button.overview'
