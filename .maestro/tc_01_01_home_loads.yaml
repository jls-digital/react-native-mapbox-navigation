appId: ch.jls.reactnative.mapboxnavigation.example
name: TC-1.1 Home screen loads with presets
tags:
  - smoke
---
- launchApp:
    clearState: true
- runFlow:
    when:
      platform: Android
    commands:
      # Emulator dev-client can't auto-discover host Metro over the NAT (no LAN
      # broadcast like the iOS simulator), so connect explicitly to the host
      # loopback alias 10.0.2.2 via the manual URL field, then dismiss the
      # expo-dev-client menu (intro "Continue" -> full menu, closed with Back).
      - tapOn: 'exp://'
      - inputText: 'http://10.0.2.2:8081'
      - tapOn: 'Connect'
      - extendedWaitUntil:
          visible: 'Continue'
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: 'Continue'
          commands:
            - tapOn: 'Continue'
      - runFlow:
          when:
            visible: 'Go home'
          commands:
            - pressKey: Back
# Fresh install: the dev-client renders its server list a beat after launch.
# Wait for it (optional) so the conditional tap below isn't skipped by an
# instantaneous visibility check that runs before the UI has drawn.
- extendedWaitUntil:
    visible:
      text: 'http://(localhost|10\.0\.2\.2|[0-9.]+):8081'
    timeout: 15000
    optional: true
# Dev client lands on its server list first on fresh install.
- runFlow:
    when:
      visible:
        text: 'http://(localhost|10\.0\.2\.2|[0-9.]+):8081'
    commands:
      - tapOn:
          text: 'http://(localhost|10\.0\.2\.2|[0-9.]+):8081'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
# First-launch expo-dev-client shows its dev menu after connecting.
# iOS: tap backdrop above the bottom sheet to dismiss.
# Android: the dev menu is full-screen; tap the Close (X) button top-right.
- runFlow:
    when:
      platform: iOS
      visible: 'Fast refresh'
    commands:
      - tapOn:
          point: '50%, 8%'
- runFlow:
    when:
      platform: Android
      visible: 'Fast Refresh'
    commands:
      # This dev-client renders the Android dev menu as a swipe-dismissable
      # bottom sheet (Reload / Go home / Fast Refresh …), not a full-screen
      # menu with a top-right X. Swipe it down to dismiss.
      - swipe:
          direction: DOWN
          duration: 400
- extendedWaitUntil:
    visible:
      id: 'home.preset.0'
    timeout: 60000
- assertVisible: 'Mapbox Navigation Demo'
- assertVisible:
    id: 'home.preset.0'
- assertVisible:
    id: 'home.preset.1'
- assertVisible:
    id: 'home.preset.2'
- assertVisible:
    id: 'home.preset.3'
- assertVisible:
    id: 'home.preset.4'
# Presets 5 and 6 are test-only error triggers (invalid coords,
# unroutable destination). They're required by TC-7.3 and TC-7.4 and
# live off-screen below the fold, so scroll to reach them.
- scrollUntilVisible:
    element:
      id: 'home.preset.6'
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: 'home.preset.5'
- assertVisible:
    id: 'home.preset.6'
- scrollUntilVisible:
    element:
      id: 'home.startNavigation'
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: 'home.startNavigation'
- assertVisible:
    id: 'home.toggle.simulation'
- assertVisible:
    id: 'home.toggle.mute'
- assertVisible:
    id: 'home.language.en'
- assertVisible:
    id: 'home.colorScheme.auto'
